[project]
name = "entrevecinos"
version = "1.0.0"
description = "API de EntreVecinos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "pydantic[email]>=2.9",
    "boto3>=1.43.115",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entrevecinos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: pruebas de integración contra la base de datos de pruebas",
    "storage: pruebas contra el almacenamiento de objetos real (MinIO)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
