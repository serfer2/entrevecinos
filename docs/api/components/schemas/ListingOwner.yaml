type: object
description: >-
  Anunciante. `phone` y `email` son el canal de contacto del MVP y solo se muestran a miembros
  aprobados de la comunidad del anuncio.
required: [id, full_name, email]
properties:
  id:
    type: string
    format: uuid
  full_name:
    type: string
  phone:
    type: [string, "null"]
  email:
    type: string
    format: email
  avatar_url:
    type: [string, "null"]
    format: uri-reference
