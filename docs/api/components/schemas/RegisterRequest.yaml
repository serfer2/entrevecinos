    type: string
    format: email
    maxLength: 320
  password:
    type: string
    format: password
    minLength: 12
    maxLength: 128
  full_name:
    type: string
    minLength: 1
    maxLength: 120
  phone:
    type: [string, "null"]
    maxLength: 32
