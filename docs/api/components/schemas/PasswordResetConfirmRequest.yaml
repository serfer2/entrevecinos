type: object
additionalProperties: false
required: [token, password]
properties:
  token:
    type: string
    minLength: 1
    maxLength: 256
    description: Token del enlace del correo.
  password:
    type: string
    minLength: 12
    maxLength: 128
    description: Contraseña nueva, con las mismas reglas que el registro.
