type: object
additionalProperties: false
minProperties: 1
description: Actualización parcial del perfil propio. `avatar_asset_id` se obtiene de `POST /media`; `null` elimina el avatar.
properties:
  full_name:
    type: string
    minLength: 1
    maxLength: 120
  phone:
    type: [string, "null"]
    maxLength: 32
  avatar_asset_id:
    type: [string, "null"]
    format: uuid
  password:
    type: string
    format: password
    minLength: 12
    maxLength: 128
    description: Nueva contraseña; requiere `current_password`.
  current_password:
    type: string
    format: password
