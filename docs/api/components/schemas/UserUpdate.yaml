type: object
additionalProperties: false
minProperties: 1
description: >-
  Actualización parcial del perfil propio: nombre y teléfono. Cualquier otro campo se rechaza con
  `422`. Cambiar el avatar o la contraseña desde el perfil queda para una versión futura; la
  contraseña se cambia con el enlace de restablecimiento (`POST /auth/password-reset`).
properties:
  full_name:
    type: string
    minLength: 1
    maxLength: 120
  phone:
    type: [string, "null"]
    maxLength: 32
    pattern: '^\+?[0-9 ()-]{6,32}$'
    description: Teléfono de contacto; `null` lo elimina.
