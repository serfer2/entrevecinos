type: object
additionalProperties: false
minProperties: 1
description: Actualización parcial de un anuncio propio. Para cambiar el estado use `PATCH /listings/{listing_id}/status`; para las imágenes, `PUT /listings/{listing_id}/images`.
properties:
  category_id:
    type: string
    format: uuid
  title:
    type: string
    minLength: 1
    maxLength: 160
  description:
    type: string
    minLength: 1
    maxLength: 5000
  type:
    $ref: ./ListingType.yaml
  price:
    type: ["number", "null"]
    minimum: 0
    multipleOf: 0.01
  currency:
    type: ["string", "null"]
    pattern: "^[A-Z]{3}$"
    description: Código de moneda ISO 4217. Si se indica precio sin moneda, se conserva la actual o se usa `EUR`.
