description: Error al restablecer la contraseña (extensión de `Error`).
allOf:
  - $ref: ./Error.yaml
  - type: object
    required: [code]
    properties:
      code:
        type: string
        enum: [password_reset_invalid, password_reset_expired]
        description: >-
          `password_reset_invalid`: el enlace no existe, ya se usó, lo sustituyó otro más reciente o
          la cuenta ya no puede usarlo. `password_reset_expired`: el enlace ha caducado.
