type: object
additionalProperties: false
required: [category_id, title, description, type]
properties:
  category_id:
    type: string
    format: uuid
  title:
    type: string
    minLength: 1
    maxLength: 160
  description:
    type: string
    minLength: 1
    maxLength: 5000
  type:
    $ref: ./ListingType.yaml
  price:
    type: ["number", "null"]
    minimum: 0
    multipleOf: 0.01
  currency:
    type: ["string", "null"]
    pattern: "^[A-Z]{3}$"
    description: Código de moneda ISO 4217. Si se indica precio sin moneda, se usa `EUR`; una moneda sin precio es un error.
  image_asset_ids:
    type: array
    maxItems: 10
    description: Ficheros subidos con `POST /media`. El primero se usa como portada.
    items:
      type: string
      format: uuid
