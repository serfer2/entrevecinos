post:
  tags: [Autenticación]
  operationId: requestPasswordReset
  summary: Pedir un enlace para restablecer la contraseña
  description: >-
    Si el correo pertenece a una cuenta activa o pendiente de validar su correo, crea un enlace para
    elegir una contraseña nueva que caduca a los 60 minutos (`PASSWORD_RESET_TTL_MINUTES`; los
    anteriores dejan de valer) y lo envía por correo. Responde siempre `202`, exista o no la cuenta,
    para no revelar qué correos están registrados. Si el último enlace se creó hace menos de 60
    segundos, no se envía otro. Sin cupo de correos responde `503`, exista o no la cuenta. Acceso
    público.
  x-mvp: true
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/PasswordResetRequest.yaml
        example:
          email: vecino@example.com
  responses:
    "202":
      description: Solicitud aceptada.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PasswordResetRequested.yaml
          example:
            detail: "Si hay una cuenta con ese correo, te enviaremos un enlace para restablecer la contraseña."
    "422":
      $ref: ../components/responses/ValidationError.yaml
    "503":
      description: >-
        Cupo de correos del periodo agotado (restricción de costes): no se envía nada.
        `Retry-After` indica los segundos hasta el inicio del periodo siguiente.
      headers:
        Retry-After:
          description: Segundos hasta el inicio del periodo siguiente (el día 6 a las 00:00, hora de Madrid).
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: ../components/schemas/EmailQuotaExceeded.yaml
          example:
            detail: "Ahora mismo no podemos enviar correos. Inténtalo de nuevo más tarde."
            code: email_quota_exceeded
