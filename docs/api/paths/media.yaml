post:
  tags: [Media]
  operationId: uploadMedia
  summary: Subir una imagen
  description: >-
    Sube un fichero JPEG, PNG o WebP (máximo 5 MB) al almacenamiento de objetos y devuelve su `id`, que se
    usa después para asociarlo a un anuncio, perfil profesional o avatar. El backend valida el tipo real del
    fichero, no solo su extensión.
  x-mvp: true
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: ../components/schemas/MediaUpload.yaml
  responses:
    "201":
      description: Imagen almacenada.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/MediaAsset.yaml
    "400":
      $ref: ../components/responses/BadRequest.yaml
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "413":
      description: El fichero supera el tamaño máximo permitido.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "415":
      description: Formato de imagen no permitido.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "422":
      $ref: ../components/responses/ValidationError.yaml
