parameters:
  - $ref: ../components/parameters/ConversationId.yaml
get:
  tags: [Mensajería]
  operationId: listMessages
  summary: Listar los mensajes de una conversación
  description: >-
    **Versión futura:** no implementada en el MVP. Mensajes en orden cronológico (`created_at`). Solo participantes; no incluye mensajes borrados.
  x-mvp: false
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PageSize.yaml
  responses:
    "200":
      description: Mensajes de la conversación.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/PageMeta.yaml
              - type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../components/schemas/Message.yaml
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
post:
  tags: [Mensajería]
  operationId: sendMessage
  summary: Enviar un mensaje
  description: >-
    **Versión futura:** no implementada en el MVP. Solo participantes. Genera una notificación `new_message` para el otro participante.
  x-mvp: false
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/MessageCreate.yaml
  responses:
    "201":
      description: Mensaje enviado.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Message.yaml
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
    "409":
      description: La conversación está cerrada o archivada.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "422":
      $ref: ../components/responses/ValidationError.yaml
