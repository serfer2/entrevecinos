post:
  tags: [Autenticación]
  operationId: confirmPasswordReset
  summary: Elegir una contraseña nueva con el enlace
  description: >-
    Cambia la contraseña con el token del enlace de `requestPasswordReset`. Borra los enlaces del
    usuario, fija la fecha del cambio (los JWT emitidos antes dejan de valer: `401`), valida el correo
    si estaba pendiente y envía un aviso del cambio por correo, que consume una plaza del cupo; sin
    cupo, la contraseña cambia igual y no se envía el aviso. No inicia sesión. Una contraseña no
    válida responde `422` sin consumir el enlace. Acceso público.
  x-mvp: true
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/PasswordResetConfirmRequest.yaml
        example:
          token: 3q2-7wP0w8mA1c4sYb9kT6uFzR5eLnVhXjQ0dGiOpKs
          password: OtraClaveSegura456!
  responses:
    "204":
      description: Contraseña cambiada.
    "400":
      description: El enlace no es válido.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PasswordResetError.yaml
          example:
            detail: "El enlace para restablecer la contraseña no es válido."
            code: password_reset_invalid
    "410":
      description: El enlace ha caducado.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PasswordResetError.yaml
          example:
            detail: "El enlace para restablecer la contraseña ha caducado."
            code: password_reset_expired
    "422":
      $ref: ../components/responses/ValidationError.yaml
