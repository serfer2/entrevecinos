post:
  tags: [Autenticación]
  operationId: registerUser
  summary: Registrar una cuenta
  description: >-
    Crea una cuenta inactiva con rol `user` y envía un correo con un enlace de validación que
    caduca a las 24 horas. No inicia la sesión: la cuenta se activa al validar el correo
    (`POST /auth/email-verification`). Acceso público.
  x-mvp: true
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RegisterRequest.yaml
        example:
          email: vecino@example.com
          password: UnaClaveSegura123!
          full_name: Alex Vecino
          phone: "+34600111222"
  responses:
    "201":
      description: Cuenta creada, pendiente de validar el correo.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RegistrationResponse.yaml
          example:
            email: vecino@example.com
            verification_expires_at: "2026-10-22T10:00:00Z"
    "409":
      description: >-
        El correo ya está registrado. Con una cuenta pendiente de validación, `code` es
        `email_pending_verification` y la cuenta no cambia.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RegistrationConflict.yaml
          examples:
            enUso:
              value:
                detail: "El correo ya está en uso."
                code: email_in_use
            pendiente:
              value:
                detail: "Este correo está pendiente de validación."
                code: email_pending_verification
    "422":
      $ref: ../components/responses/ValidationError.yaml
