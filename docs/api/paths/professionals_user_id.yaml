parameters:
  - $ref: ../components/parameters/UserId.yaml
get:
  tags: [Perfil profesional]
  operationId: getProfessionalProfile
  summary: Obtener el perfil profesional de un usuario
  description: Requiere compartir al menos una comunidad aprobada con el usuario. 404 si no tiene perfil activo.
  x-mvp: false
  responses:
    "200":
      description: Perfil profesional.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ProfessionalProfile.yaml
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
