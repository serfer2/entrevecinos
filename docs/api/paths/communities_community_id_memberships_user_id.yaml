parameters:
  - $ref: ../components/parameters/CommunityId.yaml
  - $ref: ../components/parameters/UserId.yaml
patch:
  tags: [Membresías]
  operationId: updateMembership
  summary: Revisar una solicitud, bloquear a un miembro o cambiar su rol
  description: >-
    Se envía `status` o `role`, no ambos (422). Con `status`, solo `community_admin` de la
    comunidad o `platform_admin`: aprobar o rechazar una solicitud `pending`, bloquear a un miembro
    aprobado o desbloquearlo (`approved`). Al aprobar se fijan `reviewed_by`, `reviewed_at` y
    `joined_at`. Al aprobar una solicitud `pending`, avisa por correo al vecino (una plaza del cupo
    de correos; sin cupo, se aprueba igual y no se avisa); rechazar, bloquear o desbloquear no envía
    correo. Otras transiciones, bloquear a un administrador o a uno mismo responden 409. Con `role`
    (`member` o `community_admin`; `moderator` responde 422), solo `platform_admin` (403 para el
    resto, también para un `community_admin`): nombra o quita administradores de una membresía
    `approved`, sin cambiar su estado ni enviar correo. Una membresía no aprobada o quitar el rol
    al último administrador responden 409; enviar el rol actual responde 200 sin cambios.
  x-mvp: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/MembershipUpdate.yaml
        examples:
          aprobar:
            summary: Aprobar una solicitud
            value:
              status: approved
          nombrarAdministrador:
            summary: Nombrar administrador (solo `platform_admin`)
            value:
              role: community_admin
  responses:
    "200":
      description: Membresía actualizada.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Membership.yaml
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
    "409":
      $ref: ../components/responses/Conflict.yaml
    "422":
      $ref: ../components/responses/ValidationError.yaml
delete:
  tags: [Membresías]
  operationId: deleteMembership
  summary: Salir de una comunidad o expulsar a un miembro
  description: Un usuario puede eliminar su propia membresía; un `community_admin` puede eliminar la de otros. No se puede eliminar al último administrador.
  x-mvp: true
  responses:
    "204":
      description: Membresía eliminada.
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
    "409":
      $ref: ../components/responses/Conflict.yaml
