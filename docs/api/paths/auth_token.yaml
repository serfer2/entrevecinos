post:
  tags: [Autenticación]
  operationId: loginUser
  summary: Iniciar sesión
  description: Valida las credenciales y emite un token JWT. Acceso público.
  x-mvp: true
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/LoginRequest.yaml
        example:
          email: vecino@example.com
          password: UnaClaveSegura123!
  responses:
    "200":
      description: Inicio de sesión correcto.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AuthResponse.yaml
    "401":
      description: Correo o contraseña incorrectos, o cuenta desactivada.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "403":
      description: >-
        Credenciales correctas, pero la cuenta no ha validado su correo (no aplica a un
        `platform_admin`). Solo se responde tras comprobar la contraseña.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/Error.yaml
              - type: object
                required: [code]
                properties:
                  code:
                    type: string
                    enum: [email_not_verified]
          example:
            detail: "Tienes que validar tu correo electrónico antes de iniciar sesión."
            code: email_not_verified
    "422":
      $ref: ../components/responses/ValidationError.yaml
