openapi: 3.1.0
info:
  title: API de EntreVecinos
  version: 1.0.0
  description: |
    API REST del marketplace de proximidad **EntreVecinos**.

    ## Convenciones
    - **Autenticación:** JWT en `Authorization: Bearer <token>` (`/auth/token`, o `/auth/email-verification` tras registrarse con `/auth/register`). Los endpoints públicos declaran `security: []`.
    - **Autorización (RBAC):** cada operación indica en su descripción el rol necesario: usuario autenticado, miembro aprobado de la comunidad, `community_admin`/`moderator` o `platform_admin`.
    - **MVP:** la extensión `x-mvp` marca con `true` las operaciones del MVP y con `false` las de fases posteriores.
    - **Paginación:** los listados aceptan `page` y `page_size` y devuelven `{items, page, page_size, total}`.
    - **Errores:** cuerpo `{"detail": "..."}`; los errores de validación (422) siguen el formato estándar de FastAPI.
    - **Imágenes:** se suben con `POST /media` y se asocian después a anuncios, perfiles o al avatar por su `id`.
    - **Borrado:** usuarios, anuncios y mensajes usan borrado lógico.
servers:
  - url: https://api.entrevecinos.example.com/v1
    description: Producción
  - url: http://localhost:8000/v1
    description: Desarrollo local

security:
  - bearerAuth: []

tags:
  - name: Sistema
    description: Comprobaciones de disponibilidad.
  - name: Autenticación
    description: Registro, validación del correo e inicio de sesión.
  - name: Usuarios
    description: Perfil del usuario autenticado y sus recursos.
  - name: Categorías
    description: Catálogo de categorías de anuncios.
  - name: Comunidades
    description: Creación y consulta de comunidades.
  - name: Membresías
    description: Solicitudes de acceso, aprobación y gestión de miembros.
  - name: Anuncios
    description: Consulta, publicación y gestión de anuncios.
  - name: Media
    description: Subida y lectura de imágenes.
  - name: Mensajería
    description: Conversaciones privadas entre usuarios, asociadas a anuncios (post-MVP).
  - name: Notificaciones
    description: Avisos al usuario (post-MVP).
  - name: Perfil profesional
    description: Perfiles y servicios profesionales (post-MVP).
  - name: Denuncias
    description: Denuncia y moderación de anuncios (post-MVP).
  - name: Administración
    description: Gestión de la plataforma por `platform_admin` (post-MVP).

